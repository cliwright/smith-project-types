version: '3'

tasks:
  default:
    cmds:
      - task --list

  verify:
    desc: Verify .sha256 sidecars against project-type.json and ingot files
    cmds:
      - ./scripts/verify-hashes.sh

  hash:
    desc: Regenerate .sha256 sidecars after editing a project type
    cmds:
      - ./scripts/verify-hashes.sh --write

  publish:
    desc: Pack every type into its ingot + sidecar (the artifacts smith sync fetches)
    cmds:
      - ./scripts/publish.sh
